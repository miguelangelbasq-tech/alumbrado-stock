<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cámara EMA</title>
<!-- v073 · «Cámara EMA»: ícono aparte que abre directo la cámara de la app de Alumbrado Público (misma sesión, mismos datos).
     Va en la carpeta «camara» del repositorio, con manifest.webmanifest y los íconos camara-*.png. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="camara-192.png">
<link rel="apple-touch-icon" href="camara-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:#1c1c45;color:#fff;font:600 14px/1.3 system-ui,Roboto,Arial,sans-serif;box-shadow:0 8px 24px #0008}
#inst[hidden]{display:none}
#inst span{flex:1}
#inst button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
#instSi{background:#fff;color:#1c1c45}#instNo{background:transparent;color:#fff}
</style>
</head>
<body>
<iframe id="app" src="../index.html?camara=1" allow="camera; geolocation; fullscreen; web-share; clipboard-write; autoplay" title="Cámara EMA"></iframe>
<div id="inst" hidden><span>📲 Instalar «Cámara EMA» como ícono aparte</span><button type="button" id="instSi">Instalar</button><button type="button" id="instNo" aria-label="Cerrar">✕</button></div>
<script>
(function () {
  var ev = null, inst = document.getElementById("inst");
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); ev = e; inst.hidden = false; });
  document.getElementById("instSi").onclick = function () { if (!ev) return; ev.prompt(); ev.userChoice.finally(function () { inst.hidden = true; ev = null; }); };
  document.getElementById("instNo").onclick = function () { inst.hidden = true; };
  window.addEventListener("appinstalled", function () { inst.hidden = true; });
  try { navigator.serviceWorker && navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () { }); } catch (e) { }
})();
</script>
</body>
</html>
