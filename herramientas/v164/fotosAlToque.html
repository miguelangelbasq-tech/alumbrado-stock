<script id="fotosAlToque">
(function () {
  "use strict";
  // v164 · Fotos de la cuadrilla (Ángel 16/11/2026, después de probar en obra):
  //  1) «Una vez que envían o sacan fotos de la tarea no me llega, tengo que esperar»: la cola de por atrás (Modo obra) y la
  //     bandeja (v149b) solo trabajaban con la cámara CERRADA y 1,5–1,8 s sin tocar la pantalla; si los chicos seguían usando
  //     el celu, nada salía. Ahora sale apenas pasan 0,6 s del disparo (window.__fotoLibre), de a una por turno
  //     (window.__fotoTurno: nunca en el mismo cuadro del disparo, en un hueco del hilo). Y, apenas se saca, la orden recibe la
  //     miniatura con «subiendo…» (campo.fotos.<adjId>, el número de la foto fijado de entrada); la ficha del legajo va antes
  //     que la imagen grande (guardarFotoObra). Si la app se cierra, la bandeja ya la tiene y le saca el «subiendo».
  //  2) «Es súper lento»: el disparo arma la foto a 1024 px y el sello decodifica una sola vez (createImageBitmap); de ese
  //     lienzo salen las miniaturas (140 y 72 px) y la imagen para subir (antes, comprimirImagen dos veces + __miniChica).
  //  3) «A la hora de nombrar es súper lento»: fila de botones en la cámara (Modo obra y cámara de la barra):
  //     «‹ Col 4 ›» · Columna · Tablero · PAT · Zanja · Acometida · Otro… (teclado chico con lo último escrito).
  //     Lo elegido sigue para la foto siguiente (las columnas pasan solas a la siguiente sin foto). Si no es de una tarea de
  //     su orden, la foto va igual a la orden («suelta», sin tarea) y la oficina la mueve con «↔ Mover» (v152).
  if (window.__v164No) return;
  window.__v164On = () => !window.__v164No;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (a) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[a]);
  const Lk = (s) => String(s || "").replace(/[~*\/\[\].`]/g, "_").slice(0, 120) || "_";
  const nk = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const intentar = (f, d) => { try { return f(); } catch (e) { return d; } };
  const ots = () => intentar(() => (Array.isArray(ordenesTrabajo) ? ordenesTrabajo : []), []);
  const otDe = (id) => ots().find((o) => o && o.id === id) || null;
  const CA = () => window.camaraApp || {};
  const catTxt = (c) => intentar(() => window.catFotoTxt(c), c);
  const pideNum = (c) => intentar(() => !!window.catFotoPideNum(c), false);
  const MED = [];   // tiempos de las últimas fotos (menú › Versión y pruebas)
  const medir = (adj, k) => { if (!adj) return; let m = MED.find((x) => x.adj === adj); if (!m) { m = { adj, t0: Date.now() }; MED.push(m); if (MED.length > 30) MED.shift(); } if (m[k] == null) m[k] = Date.now() - m.t0; };

  // ------------------------------------------------------------------ cuándo se puede trabajar (sin trabar el disparador)
  let ultDisparo = 0, ultToque = 0;
  document.addEventListener("pointerdown", (e) => { ultToque = Date.now(); if (e.target && e.target.closest && e.target.closest('#emaCam [data-ec="disparar"]')) ultDisparo = Date.now(); }, true);
  document.addEventListener("click", (e) => { if (e.target && e.target.closest && e.target.closest('#emaCam [data-ec="disparar"]')) ultDisparo = Date.now(); }, true);
  const QUIETO_MS = 1500;   // después de cada disparo, nada pesado durante 1,5 s (a confirmar): con fotos seguidas, se guardan al parar
  const ultD = () => Math.max(ultDisparo, window.__camUltDisparo || 0);
  const libre = () => document.hidden || (Date.now() - ultD() > QUIETO_MS && Date.now() - ultToque > 200);
  // lo pesado de cada foto espera a que pase ~1 s sin tocar el disparador (y a un hueco del hilo)
  window.__fotoQuieto = () => new Promise((ok) => {
    const mirar = () => { const f = QUIETO_MS - (Date.now() - ultD()); if (f > 0 && !document.hidden) return setTimeout(mirar, Math.min(f + 20, 400)); if (typeof window.requestIdleCallback == "function") window.requestIdleCallback(() => ok(), { timeout: 300 }); else setTimeout(ok, 16); };
    mirar();
  });
  window.__fotoLibre = libre;
  // de a una: el sello pide el turno; la base lo suelta apenas la ficha está escrita (la imagen sube mientras sigue la otra)
  const TU = { ocupado: false, esperan: [], n: 0 };
  function mover() {
    if (TU.ocupado || !TU.esperan.length) return;
    if (!libre()) return void setTimeout(mover, 120);
    TU.ocupado = true; const ok = TU.esperan.shift(); let suelto = false;
    const soltar = () => { if (suelto) return; suelto = true; clearTimeout(tope); TU.ocupado = false; setTimeout(mover, 0); };
    const tope = setTimeout(soltar, 20000);
    const ir = () => { TU.n++; ok(soltar); };
    if (typeof window.requestIdleCallback == "function") window.requestIdleCallback(ir, { timeout: 250 }); else setTimeout(ir, 16);
  }
  window.__fotoTurno = { pedir: () => new Promise((ok) => { TU.esperan.push(ok); mover(); }), estado: () => ({ ocupado: TU.ocupado, esperan: TU.esperan.length, n: TU.n }) };

  // ------------------------------------------------------------------ miniaturas
  function aDataUrl(b) { return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => mal(r.error); r.readAsDataURL(b); }); }
  function chica(src, w0, h0, lado, tope) {
    const k = Math.min(1, lado / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(src, 0, 0, w, h);
    let q = 0.7, u = cv.toDataURL("image/jpeg", q);
    while (u.length > tope && q > 0.3) { q -= 0.1; u = cv.toDataURL("image/jpeg", q); }
    return u;
  }
  // del lienzo del sello (ya dibujado): la del legajo (140 px, < 7 KB) y la de la orden (72 px, < 3 KB)
  function minisDe(cv, meta) { meta.__mini140 = chica(cv, cv.width, cv.height, 140, 9300); meta.__mini72 = chica(cv, cv.width, cv.height, 72, 3000); }
  // de la foto recién sacada (antes del sello): decodifica chica, fuera del hilo
  const MINIS = {};   // la miniatura que ya se armó con el cuadro del disparo (nombre|tamaño → dataURL)
  const claveMini = (f) => (f ? (f.name || "") + "|" + (f.size || 0) : "");
  async function miniDe(f) {
    const m0 = MINIS[claveMini(f)]; if (m0) return m0;
    if (typeof createImageBitmap == "function") {
      try { const b = await createImageBitmap(f, { resizeWidth: 96, resizeQuality: "low" }); const u = chica(b, b.width, b.height, 72, 3000); try { b.close(); } catch (e) { } return u; } catch (e) { }
    }
    const url = URL.createObjectURL(f);
    try { const i = await new Promise((ok, mal) => { const x = new Image(); x.onload = () => ok(x); x.onerror = mal; x.src = url; }); return chica(i, i.naturalWidth, i.naturalHeight, 72, 3000); }
    catch (e) { return ""; } finally { URL.revokeObjectURL(url); }
  }
  // la imagen para subir, del archivo sellado (si pesa más de 350 KB, la base la vuelve a achicar como antes)
  async function pre(blob, wh) { if (!blob || blob.size > 350 * 1024) return null; try { return { dataUrl: await aDataUrl(blob), w: wh[0], h: wh[1], bytes: blob.size }; } catch (e) { return null; } }
  const nuevoAdj = () => { try { return firebase.firestore().collection("adjuntos").doc().id; } catch (e) { return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); } };

  // ------------------------------------------------------------------ la oficina la ve al toque
  // Modo obra: pe = la foto pendiente (cuadrillaDia), guardar(patch) = __mtAPI.guardar de esa orden
  function anunciar(o, pe, f, guardar) {
    medir(pe.adjId, "disparo");
    miniDe(f).then((m) => {
      if (pe.fin) return;   // ya está la de verdad
      pe.miniB = m || "";
      guardar({ ["campo.fotos." + Lk(pe.adjId)]: Object.assign({ por: pe.por, ts: pe.ts, cat: pe.cat || "otra", num: pe.num || "", mini: m || "", subiendo: true }, pe.k ? { k: pe.k, tarea: pe.tarea } : {}) });
      medir(pe.adjId, "anuncio");
      const sb = document.querySelector('#cdHoja .cd-sube[data-pe="' + pe.id + '"]'); if (sb && !pe.fin) sb.textContent = "✓ La oficina ya la ve · subiendo la foto…";
    }).catch((e) => console.warn("[v164] miniatura", e));
  }
  // cámara de la barra: la foto queda en la bandeja ya mismo y la orden (si hay) recibe la miniatura
  function antes(file, meta, ot, campoFoto) {
    const adj = nuevoAdj(); meta.__adjId = adj; medir(adj, "disparo");
    const B = window.__fotoBandeja;
    if (B && typeof B.ponerNueva == "function") {
      const id = "cb_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), m = {};
      Object.keys(meta).forEach((k) => { const v = meta[k]; if (v == null || typeof v == "function" || k === "__adjId" || k === "__bandejaId") return; m[k] = v; });
      meta.__bandejaId = id;
      try { B.ponerNueva({ id, f: file, meta: m, plaza: meta.plazaNombre || "", origen: "camara", otId: meta.otId || "", k: meta.k || "", tarea: meta.tarea || "", cat: meta.cat || "", num: meta.num || "", por: meta.por || "", ts: Date.now(), adjId: adj }); } catch (e) { }
    }
    if (ot && typeof campoFoto == "function") miniDe(file).then((mi) => {
      if (HECHAS[adj]) return;   // la de verdad ya llegó a la orden: no la vuelve a poner «subiendo»
      campoFoto(ot.id, { ["campo.fotos." + Lk(adj)]: Object.assign({ por: meta.por || "", ts: Date.now(), cat: meta.cat || "otra", num: meta.num || "", mini: mi || "", subiendo: true }, meta.k ? { k: meta.k, tarea: meta.tarea } : {}) });
      medir(adj, "anuncio");
    }).catch(() => { });
  }
  // la imagen de una foto que todavía está subiendo: se espera un poco antes de decir «no está»
  function envolverLeer() {
    const o = window.fbAdjuntoLeer; if (typeof o != "function" || o.__v164) return;
    const n = async function (id) {
      let r = await o.apply(this, arguments);
      for (let i = 0; !r && i < 3; i++) { await new Promise((ok) => setTimeout(ok, 2500)); r = await o.apply(this, arguments); }
      return r;
    };
    window.__heredar && window.__heredar(n, o); n.__v164 = 1; window.fbAdjuntoLeer = n;
  }
  setTimeout(envolverLeer, 4000); setInterval(envolverLeer, 5000);
  // tiempos: cuándo llegó a la base cada foto (lo mira la prueba y menú › Versión)
  const HECHAS = {};
  const vigilar = () => { try { const g = window.guardarFotoObra; if (typeof g != "function" || g.__v164m) return; const n = function (f, meta) { const adj = meta && meta.__adjId; const p = g.apply(this, arguments); Promise.resolve(p).then(() => { if (adj) HECHAS[adj] = 1; medir(adj, "base"); }, () => medir(adj, "celu")); return p; }; window.__heredar && window.__heredar(n, g); n.__v164m = 1; window.guardarFotoObra = n; } catch (e) { } };
  setTimeout(vigilar, 3000);

  // ------------------------------------------------------------------ nombrar en la cámara
  const CHIPS = [["columna", "Columna"], ["tablero", "Tablero"], ["pat", "PAT"], ["zanja", "Zanja"], ["conexion", "Acometida"], ["otra", "Otro…"]];
  const KREC = "ema.foto.otros";
  const recientes = () => intentar(() => JSON.parse(localStorage.getItem(KREC) || "[]") || [], []).filter((x) => typeof x == "string" && x.trim()).slice(0, 8);
  const recordar = (t) => { t = String(t || "").trim().slice(0, 40); if (!t) return; const l = [t].concat(recientes().filter((x) => nk(x) !== nk(t))).slice(0, 8); try { localStorage.setItem(KREC, JSON.stringify(l)); } catch (e) { } };
  const chipsHtml = (cat, attr) => `<div class="fn-chips">${CHIPS.map((c) => c[0] === "otra" ? `<button type="button" class="fn-chip${cat === "otra" ? " on" : ""}" data-fnotro="1">${esc(c[1])}</button>` : `<button type="button" class="fn-chip${cat === c[0] || (c[0] === "columna" && (cat === "caja" || cat === "luminaria") && false) ? " on" : ""}" ${attr}="${c[0]}">${esc(c[1])}</button>`).join("")}</div>`;
  // cámara de la barra: los botones de siempre (data-cbm los maneja obraGps) + «Otro…»
  function filaCb(CB) { return chipsHtml(CB.cat, "data-cbm"); }

  // Modo obra: estado de lo que va a decir la foto
  let NM = null;
  const STK = {};   // por orden: lo que eligió a mano (sigue para la foto siguiente)
  const tareasDe = (o) => intentar(() => window.__mtAPI.tareas(o) || [], []);
  const uniDe = (o, k) => (k ? intentar(() => window.__cuadrillaDia.unidades(o.id, k), null) : null);
  const catDeT = (o, t) => { const u = uniDe(o, t.k); return (u && u.cat) || intentar(() => window.catFotoDeTarea(t.label), "otra"); };
  function sigNum(o, k) { const u = uniDe(o, k); if (!u || u.tipo !== "unidad" || !u.items.length) return ""; const it = u.items.find((x) => !x.foto && !x.paso) || u.items.find((x) => !x.foto) || u.items[0]; return it.num; }
  function elegir(cat, op) {
    op = op || {};
    const o = otDe(NM.ot); if (!o) return;
    NM.otro = cat === "otra" ? String(op.otro || "") : "";
    const ts = tareasDe(o), t = cat === "otra" ? null : (ts.find((x) => x.k === NM.k0 && catDeT(o, x) === cat) || ts.find((x) => catDeT(o, x) === cat));
    NM.cat = cat;
    if (t) { NM.k = t.k; NM.lbl = t.label; NM.suelta = false; NM.num = op.num || (pideNum(cat) ? sigNum(o, t.k) : ""); }
    else { NM.k = ""; NM.lbl = cat === "otra" ? NM.otro || "Otra" : catTxt(cat); NM.suelta = true; NM.num = ""; }
    if (op.manual) { NM.manual = true; STK[o.id] = { cat, otro: NM.otro, ts: Date.now() }; }
    aplicar();
  }
  const primera = (s) => String(s || "").split(/\s[·\-–(]/)[0].trim();
  function aplicar() {
    const inp = NM.inp; if (!inp) return;
    const que = NM.cat === "otra" ? (NM.otro || "Otra") : NM.num || (NM.suelta ? catTxt(NM.cat) : NM.lbl || catTxt(NM.cat));
    inp.dataset.k = NM.k; inp.dataset.cat = NM.cat; inp.dataset.fln = que; inp.dataset.fnSuelta = NM.suelta ? "1" : "";
    const tit = NM.suelta ? que : primera(NM.lbl) + (NM.num ? " · " + NM.num : "");
    intentar(() => CA().ponerQue(que, tit), null);
    const g = document.querySelector("#emaCam .cd-guia span"); if (g) g.textContent = NM.cat === "columna" ? "Columna entera en el cuadro ✓" : NM.cat === "otra" ? "Que se vea lo que es ✓" : "Que se vea el trabajo ✓";
    pintar();
  }
  function filaHtml() {
    const o = otDe(NM.ot), u = o && NM.k && pideNum(NM.cat) ? uniDe(o, NM.k) : null, lista = u && u.tipo === "unidad" ? u.items : null;
    const n = lista ? lista.filter((x) => x.foto).length : 0;
    const que = NM.cat === "otra" ? NM.otro || "Otra" : NM.num || (NM.suelta ? catTxt(NM.cat) : primera(NM.lbl) || catTxt(NM.cat));
    const sub = NM.suelta ? "va a la orden sin tarea" : lista ? n + " de " + lista.length + " con foto" : primera(NM.lbl) || "foto";
    return `<div class="fn-num"><button type="button" class="fn-fl" data-fn="prev" aria-label="Anterior"${lista ? "" : " disabled"}>‹</button><div class="fn-nt" aria-live="polite"><b>${esc(que)}</b><small>${esc(sub)}</small></div><button type="button" class="fn-fl" data-fn="next" aria-label="Siguiente"${lista ? "" : " disabled"}>›</button></div>` + chipsHtml(NM.cat === "caja" || NM.cat === "luminaria" ? "columna" : NM.cat, "data-fncat");
  }
  function pintar() {
    const cam = $("emaCam"); if (!cam || !NM) return;
    let f = $("fnFila"); if (!f) { f = document.createElement("div"); f.id = "fnFila"; cam.appendChild(f); cam.classList.add("fn-on"); }
    const h = filaHtml(); if (f.__h !== h) { f.innerHTML = h; f.__h = h; }
  }
  function mover1(paso) {
    const o = otDe(NM.ot), u = o && uniDe(o, NM.k); if (!u || u.tipo !== "unidad" || !u.items.length) return;
    const i = u.items.findIndex((x) => nk(x.num) === nk(NM.num)), j = Math.max(0, Math.min(u.items.length - 1, (i < 0 ? 0 : i) + paso));
    NM.num = u.items[j].num; aplicar();
  }
  function alAbrir() {
    const cam = $("emaCam"), inp = intentar(() => CA().inp(), null);
    if (!cam || !inp || inp.id !== "cdFotoIn" || cam.__fn) return;
    cam.__fn = 1;
