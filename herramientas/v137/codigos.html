<script id="codigosQr">
(function () {
  "use strict";
  // v137 · Códigos (pedido de Ángel, 09/11/2026):
  //  1) QR chico arriba a la derecha en todos los comprobantes (vales S-, entradas E-, devoluciones D-, remitos de herramientas
  //     RH- / RI-, reservas R-, órdenes OT-) y en los informes de una obra (QR al legajo). Se arma en el aparato, sin internet,
  //     con qrcode-generator (MIT) como imagen PNG: sale igual en pantalla, impreso y en el PDF (html2canvas).
  //     Lleva la dirección de la app: …/alumbrado-stock/?doc=S-0001 · ?doc=OT-2026-012 · ?doc=H-003 · ?obra=<id>.
  //  2) Al abrir esa dirección (o escanearla desde la app) se abre el documento, después de entrar y con los permisos de cada uno.
  //  3) Lector de códigos: el de la app de Android (ML Kit, __escanear); en el navegador, BarcodeDetector si existe; si no, a mano.
  //  4) Código de barras (EAN) de cada producto: catalogoProductos/{codigo}.ean = [..] por fbGuardarProductoCatalogo.
  //     Un EAN no queda en dos productos (avisa y pregunta). Al escanear: ficha con stock, «Hacer vale de salida» y «Entrada».
  //  5) Herramientas: QR por herramienta (H-xxx) y «🏷 Imprimir etiquetas QR».
  //  Nada se escribe en la base sin que la persona toque «Sí» / «Asociar».
  const $ = (id) => document.getElementById(id);
  const esc = (t) => (typeof escHtml == "function" ? escHtml(String(t == null ? "" : t)) : String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]));
  const BASE = "https://miguelangelbasq-tech.github.io/alumbrado-stock/";
  const nrm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const perm = (h) => { try { return window.PERMISOS && PERMISOS.permiso ? PERMISOS.permiso(h) : "editar"; } catch (e) { return "editar"; } };
  const soloCat = () => { try { return !!(window.__panolSoloCatalogo && window.__panolSoloCatalogo()); } catch (e) { return false; } };
  const editaStock = () => !!window.__fbUser && perm("stock") === "editar";
  const veStock = () => perm("stock") !== "oculto" && !soloCat();
  const yoEmail = () => (window.__fbUser && window.__fbUser.email) || "";
  const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
  async function hasta(fn, ms) { const t0 = Date.now(); for (;;) { let v = null; try { v = fn(); } catch (e) { v = null; } if (v) return v; if (Date.now() - t0 > ms) return null; await espera(250); } }
  const plug = () => (window.Capacitor && window.Capacitor.Plugins) || {};
  const avisar = (t) => { try { window.alert(t); } catch (e) { } };

  // =================================================================================== QR
  const cacheQr = new Map();
  function matriz(texto) {
    const q = window.__qrcodeLib(0, "M"); q.addData(String(texto), "Byte"); q.make();
    const n = q.getModuleCount(), m = [];
    for (let r = 0; r < n; r++) { const f = []; for (let c = 0; c < n; c++) f.push(q.isDark(r, c) ? 1 : 0); m.push(f); }
    return m;
  }
  function dataUrl(texto) {
    const k = String(texto); if (cacheQr.has(k)) return cacheQr.get(k);
    const m = matriz(k), n = m.length, s = 6, borde = 4, lado = (n + borde * 2) * s;
    const cv = document.createElement("canvas"); cv.width = lado; cv.height = lado;
    const g = cv.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, lado, lado); g.fillStyle = "#000000";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) g.fillRect((c + borde) * s, (r + borde) * s, s, s);
    const u = cv.toDataURL("image/png"); cacheQr.set(k, u);
    if (cacheQr.size > 300) cacheQr.delete(cacheQr.keys().next().value);
    return u;
  }
  const urlDoc = (doc) => BASE + "?doc=" + encodeURIComponent(String(doc).toUpperCase());
  const urlObra = (id) => BASE + "?obra=" + encodeURIComponent(String(id));
  const obras = () => (typeof avanceObras != "undefined" && Array.isArray(avanceObras) ? avanceObras : []);
  const ots = () => (typeof ordenesTrabajo != "undefined" && Array.isArray(ordenesTrabajo) ? ordenesTrabajo : []);
  // qué documento es la hoja, por su título
  function docDeTitulo(t) {
    let m;
    if ((m = t.match(/N°\s*([SED]-\d{3,})/))) return { doc: m[1] };
    if ((m = t.match(/\b(OT-\d{4}-\d+)/))) return { doc: m[1] };
    if ((m = t.match(/\b(R[HI]-[0-9A-Z][0-9A-Z-]*)/i))) return { doc: m[1].toUpperCase() };
    if ((m = t.match(/^Reserva\s+(R-\d+)/))) return { doc: m[1] };
    if (/informe|avance|balance|material|itemizado|legajo|c[oó]mputo|historial/i.test(t)) {   // informes de una obra: QR al legajo
      const tt = nrm(t); let best = null;
      obras().forEach((o) => { const nn = nrm(o.nombre || o.plazaNombre); if (nn.length >= 4 && tt.indexOf(nn) >= 0 && (!best || nn.length > best.l)) best = { id: o.id, l: nn.length }; });
      if (best) return { obra: best.id };
    }
    return null;
  }
  const bloqueQr = (url, et) => `<div class="ema-qr" style="position:absolute;top:14px;right:22px;width:72px;text-align:center;font:700 8.5px/1.2 ui-monospace,Menlo,monospace;color:#28285e;background:#fff"><img src="${dataUrl(url)}" width="68" height="68" alt="QR ${esc(et)}" style="display:block;width:68px;height:68px;margin:0 auto 1px"><div>${esc(et)}</div></div>`;
  // lo llama la hoja de impresión (hojaPdf) antes de mostrar cada hoja
  window.__qrHoja = function (titulo, doc) {
    try {
      if (!doc || /class="ema-qr/.test(doc) || !window.__qrcodeLib) return doc;
      const d = docDeTitulo(String(titulo || "")); if (!d) return doc;
      const url = d.doc ? urlDoc(d.doc) : urlObra(d.obra), et = d.doc || "Legajo";
      const b = `<style>.membrete{padding-right:86px}</style>` + bloqueQr(url, et);
      return /<body[^>]*>/i.test(doc) ? doc.replace(/<body[^>]*>/i, (x) => x + b) : b + doc;
    } catch (e) { console.warn("[qr] hoja:", e); return doc; }
  };
  // reservas: un QR en cada hoja (se imprimen varias juntas)
  window.__qrReserva = function (r) {
    try { return r && r.numero && window.__qrcodeLib ? `<span class="ema-qr-r" style="float:right;margin:0 0 6px 12px;text-align:center"><img src="${dataUrl(urlDoc(r.numero))}" width="64" height="64" alt="QR ${esc(r.numero)}" style="display:block;width:64px;height:64px"></span>` : ""; } catch (e) { return ""; }
  };

  // =================================================================================== hojas propias
  function hoja(id, html, cls) {
    cerrarHoja(id);
    const ov = document.createElement("div"); ov.id = id; ov.className = "v7-ov no-print" + (cls ? " " + cls : ""); ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
    ov.innerHTML = `<div class="v7-caja"><div class="v7-asa"></div>${html}</div>`;
    ov.addEventListener("click", (e) => { if (e.target === ov) cerrarHoja(id); });
    document.body.appendChild(ov); return ov;
  }
  function cerrarHoja(id) { const o = $(id); if (o) { o.remove(); if (o.__fin) try { o.__fin(); } catch (e) { } } }
  // «¿seguro?» con Sí / No (sin confirm() del navegador)
  function preguntar(titulo, texto, si, no) {
    return new Promise((ok) => {
      const ov = hoja("v7Preg", `<div class="v7-cab"><h3>${esc(titulo)}</h3></div><p class="v7-txt">${esc(texto)}</p><div class="v7-acc"><button type="button" class="btn-primary" data-v7p="si">${esc(si || "Sí")}</button><button type="button" class="btn-ghost" data-v7p="no">${esc(no || "No")}</button></div>`, "v7-arriba");
      let listo = false; const fin = (v) => { if (listo) return; listo = true; ov.__fin = null; ov.remove(); ok(v); };
      ov.__fin = () => fin(false);
      ov.addEventListener("click", (e) => { const b = e.target.closest("[data-v7p]"); if (b) fin(b.dataset.v7p === "si"); });
    });
  }

  // =================================================================================== lector de códigos
  let escaneando = false;
  async function escanear(titulo, ayuda) {
    if (escaneando) return "";
    escaneando = true;
    try {
      if (plug().BarcodeScanner && typeof window.__escanear == "function") {
        try { const c = await window.__escanear(); return String(c || "").trim(); }
        catch (e) { console.warn("[lector] app:", e); }
      }
      return await ventanaLector(titulo, ayuda);
    } finally { escaneando = false; }
  }
  function ventanaLector(titulo, ayuda) {
    return new Promise((ok) => {
      const hayBD = typeof window.BarcodeDetector == "function" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
      const ov = hoja("esOv", `<div class="v7-cab"><div><h3>${esc(titulo || "📷 Escanear")}</h3><small>${esc(ayuda || "Apuntá al código de barras o al QR.")}</small></div><button type="button" class="v7-x" data-es="x" aria-label="Cerrar">✕</button></div>
${hayBD ? '<div class="es-video"><video playsinline muted autoplay></video><div class="es-mira"></div></div>' : '<p class="v7-sub" style="margin-bottom:10px;">Este aparato no puede leer códigos con la cámara: escribí el número que está abajo del código de barras (o el que trae el QR, por ejemplo H-003).</p>'}
<label for="esManual">${hayBD ? "¿No lo lee? Escribí el número" : "Número del código"}</label>
<div class="es-manual"><input type="text" id="esManual" inputmode="text" autocomplete="off" placeholder="Ej: 7790123456789"><button type="button" class="btn-primary" data-es="ok">Listo</button></div>
<div class="v7-msg" id="esMsg"></div>`, "v7-esc");
      let fin = false, stream = null, tm = null;
      const terminar = (v) => { if (fin) return; fin = true; clearTimeout(tm); try { stream && stream.getTracks().forEach((t) => t.stop()); } catch (e) { } ov.__fin = null; ov.remove(); ok(String(v || "").trim()); };
      ov.__fin = () => terminar("");
      ov.addEventListener("click", (e) => { const b = e.target.closest("[data-es]"); if (!b) return; if (b.dataset.es === "x") terminar(""); else terminar(($("esManual") || {}).value); });
      ov.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "esManual") { e.preventDefault(); terminar(e.target.value); } });
      if (!hayBD) { setTimeout(() => { const i = $("esManual"); i && i.focus(); }, 60); return; }
      (async () => {
        try {
          let fmts = ["qr_code", "ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"];
          try { const sop = await window.BarcodeDetector.getSupportedFormats(); fmts = fmts.filter((f) => sop.indexOf(f) >= 0); } catch (e) { }
          const det = new window.BarcodeDetector(fmts.length ? { formats: fmts } : undefined);
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
          if (fin) { stream.getTracks().forEach((t) => t.stop()); return; }
          const v = ov.querySelector("video"); v.srcObject = stream; try { await v.play(); } catch (e) { }
          const mirar = async () => {
            if (fin) return;
            try { const r = await det.detect(v); if (r && r[0] && r[0].rawValue) return terminar(r[0].rawValue); } catch (e) { }
            tm = setTimeout(mirar, 300);
          };
          mirar();
        } catch (e) {
          const m = $("esMsg"); if (m) { m.className = "v7-msg mal"; m.textContent = "No se pudo abrir la cámara: escribí el número a mano."; }
        }
      })();
    });
  }

  // =================================================================================== qué es lo escaneado
  function refDeTexto(c) {
    c = String(c || "").trim();
    if (/^https?:\/\//i.test(c)) {
      try { const u = new URL(c), d = u.searchParams.get("doc"), o = u.searchParams.get("obra"); if (d) return { doc: d }; if (o) return { obra: o }; } catch (e) { }
      return null;
    }
    const m = c.toUpperCase().match(/^(H-\d+|[SED]-\d+|OT-\d{4}-\d+|R-\d+|R[HI]-[0-9A-Z][0-9A-Z-]*)$/);
    return m ? { doc: m[1] } : null;
  }
  async function alEscanear(c, codigoPara) {
    c = String(c || "").trim(); if (!c) return;
    const ref = refDeTexto(c);
    if (ref) return abrirRef(ref);
    const ean = c.replace(/\s+/g, "");
    if (/^\d{6,14}$/.test(ean)) return codigoPara ? asociarYAbrir(codigoPara, ean) : productoPorEan(ean);
    avisar(`No reconozco ese código: «${c}».`);
  }
  async function escanearYAbrir() { const c = await escanear("📷 Escanear", "Código de barras de un producto, QR de una herramienta o de un comprobante."); if (c) await alEscanear(c); }

  // =================================================================================== abrir un documento (?doc= / QR)
  const noPerm = () => avisar("🔒 No tenés permiso para ver esto.");
  const movs = () => (Array.isArray(window.stockMovimientos) ? window.stockMovimientos : []);
  function movPorNumero(d) {
    const l = movs(); let m = l.find((x) => String(x.numero || "").toUpperCase() === d);
    if (!m && typeof window.numeroComprobante == "function") m = l.find((x) => !x.numero && (x.tipo === "entrada" || x.tipo === "salida") && String(window.numeroComprobante(x) || "").toUpperCase() === d);
    return m || null;
  }
  function clickCon(attrs, cls) { const b = document.createElement("button"); b.type = "button"; if (cls) b.className = cls; Object.keys(attrs).forEach((k) => b.setAttribute(k, attrs[k])); b.style.display = "none"; document.body.appendChild(b); try { b.click(); } finally { b.remove(); } }
  const irStock = (sub) => { try { if (window.__v135 && window.__v135.irStock) window.__v135.irStock(sub); else { window.mostrarVista("stock"); setTimeout(() => { const b = document.querySelector('#subtabsStock .subtab[data-sub="' + sub + '"]'); b && !b.classList.contains("activo") && b.click(); }, 60); } } catch (e) { } };
  async function abrirHerramienta(cod) {
    irStock("herramientas");
    const h = await hasta(() => (window.__herramientasLista || []).find((x) => String(x.codigo || "").toUpperCase() === cod), 12000);
    if (!h) return avisar(`No encontré la herramienta ${cod}.`);
    await espera(150); clickCon({ "data-hrabrir": h.id });
  }
  async function abrirRef(ref) {
    if (ref.obra) {
      if (perm("obras") === "oculto") return noPerm();
      const o = await hasta(() => obras().find((x) => x.id === ref.obra), 12000);
      if (!o) return avisar("No encontré esa obra.");
      try { window.mostrarVista("obras"); } catch (e) { }
      if (typeof window.abrirLegajo == "function") window.abrirLegajo(o.id);
      return;
    }
    const d = String(ref.doc || "").toUpperCase().trim();
    if (/^OT-/.test(d)) {
      const de = (o) => String(o.numero || "").toUpperCase() === d;
      if (perm("parte") !== "oculto") {
        const o = await hasta(() => ots().find(de), 12000);
        if (!o) return avisar(`No encontré la orden ${d}.`);
        if (typeof window.verOrdenTrabajo == "function") window.verOrdenTrabajo(o.id);
        return;
      }
      const o = await hasta(() => ots().find(de), 8000), yo = (window.PERMISOS && PERMISOS.yo && PERMISOS.yo()) || {};
      if (o && yo.personaClave && (o.personalNombres || []).indexOf(yo.personaClave) >= 0) { try { window.mostrarVista("mistareas"); } catch (e) { } return; }
      return noPerm();
    }
    if (!veStock()) return noPerm();
    if (/^[SED]-\d+$/.test(d)) {
      const m = await hasta(() => movPorNumero(d), 15000);
      if (!m) return avisar(`No encontré el comprobante ${d}.`);
      if (typeof window.verComprobanteMovimiento == "function") window.verComprobanteMovimiento(m.id);
      return;
    }
    if (/^R-\d+$/.test(d)) {
      const r = await hasta(() => (window.reservasMaterial || []).find((x) => String(x.numero || "").toUpperCase() === d), 12000);
      if (!r) return avisar(`No encontré la reserva ${d}.`);
      if (typeof window.irAReservas == "function") window.irAReservas(r.id);
      return;
    }
    if (/^H-\d+$/.test(d)) return abrirHerramienta(d);
    if (/^RH-/.test(d)) {
      irStock("herramientas");
      const hr = await hasta(() => window.__herrRemito, 5000);
      const ref = hr && await hasta(() => {
        const l = hr.movs().map((m) => "mov:" + m.id).concat((window.__herramientasLista || []).filter((h) => h.asignada).map((h) => "asig:" + h.id));
        return l.find((x) => { const z = hr.remitoDatos(x); return z && String(z.num).toUpperCase() === d; });
      }, 12000);
      if (!ref) return avisar(`No encontré el remito ${d}.`);
      hr.imprimirRemito(ref); return;
    }
    if (/^RI-/.test(d)) {
      irStock("herramientas");
      const hi = await hasta(() => window.__herrIngreso, 5000);
      const ref = hi && await hasta(() => {
        const l = (window.__herramientasLista || []).map((h) => (h.ingreso && h.ingreso.lote ? "lote:" + h.ingreso.lote : "h:" + h.id));
        return l.find((x) => { const z = hi.datos(x); return z && String(z.num).toUpperCase() === d; });
      }, 12000);
      if (!ref) return avisar(`No encontré el remito ${d}.`);
      hi.imprimir(ref); return;
    }
    avisar(`No reconozco «${d}».`);
  }
  // la dirección con ?doc= / ?obra=: se guarda hasta que la persona entra
  (function pendiente() {
    let p = null;
    try {
